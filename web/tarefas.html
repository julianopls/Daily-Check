<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daily Check</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <nav class="navbar">

    <h2 class="logo">Daily Check</h2>

    <ul class="menu">
      <li><a href="index.html">Home</a></li>
      <li><a href="temperatura.html">Temperatura</a></li>
      <li><a href="tarefas.html">Tarefas</a></li>
    </ul>

  </nav>

  <section class="topo">

    <h1>Cadastro de Tarefas</h1>

  </section>

  <section class="form-container">

    <div class="form">

      <input type="text" id="titulo" placeholder="Nome da tarefa">

      <input type="date" id="datainicio">

      <input type="date" id="datafinal">

      <input type="text" id="imgurl" placeholder="URL da imagem">

      <button onclick="abrirModal()">
        Adicionar Tarefa
      </button>

    </div>

  </section>

  <div id="modal" class="modal">

    <div class="modal-content">

      <h2>Descrição da tarefa</h2>

      <textarea id="descricao" placeholder="Digite a descrição da tarefa"></textarea>

      <div class="botoes-modal">

        <button onclick="salvarTarefa()">
          Salvar
        </button>

        <button onclick="fecharModal()">
          Fechar
        </button>

      </div>

    </div>

  </div>

  <script src="script.js"></script>

</body>

</html>
